# typography
font_family      Liga SFMono Nerd Font
bold_font        JetBrains Mono Nerd Font
italic_font      IBM Plex Mono Italic
bold_italic_font IBM Plex Mono Italic

font_size 10

disable_ligatures cursor

# cursor
cursor_shape block

cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# window
remember_window_size no
background_opacity 1.0
window_padding_width 20.0
window_margin_width 0
placement_strategy center
hide_window_decorations no

# tabs
tab_bar_style fade
tab_bar_min_tabs 2

# bell
enable_audio_bell no

# colorscheme
foreground            #f0f0f0
background            #141414

selection_foreground  #262626
selection_background  #e7e7e7

cursor                #f0f0f0
cursor_text_color     #141414

url_color             #c6a679

# black
color0   #141414
color8   #383838

# red
color1   #ac8a8c
color9   #c49ea0

# green
color2   #8aac8b
color10  #9ec49f

# yellow
color3   #aca98a
color11  #c4c19e

